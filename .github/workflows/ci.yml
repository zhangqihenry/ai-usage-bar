name: CI

# Build and test on every push and pull request. This job intentionally runs
# without Xcode-specific steps: the promise of the project is that Command Line
# Tools are enough, and this is the check that keeps it honest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build
        run: swift build

      - name: Self test
        run: swift run UsageBarSelfTest

      - name: Lint
        run: make lint

      - name: Assemble app bundle
        run: CONFIG=debug scripts/build-app.sh

      - name: Verify bundle
        run: |
          test -x dist/UsageBar.app/Contents/MacOS/UsageBar
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/UsageBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/UsageBar.app/Contents/Info.plist
          codesign --verify --verbose dist/UsageBar.app
          ./dist/UsageBar.app/Contents/MacOS/UsageBar --version

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: UsageBar-app
          path: dist/UsageBar.app
          if-no-files-found: error
